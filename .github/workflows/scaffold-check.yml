name: Scaffold checks (CPU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free scaffold checks
        run: python -m unittest discover -s tests -v
      - name: Prepare packaging tools (no model downloads)
        run: python -m pip install --disable-pip-version-check build
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify installed wheel outside the checkout
        run: python scripts/check_wheel.py dist/*.whl
