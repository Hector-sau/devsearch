name: CPU baseline checks

# Two jobs. `cpu-baseline` is the dependency-free check: unit tests (ML and API tests are
# *reported as skipped*, never as passed), wheel build and an installed-wheel run over tiny
# fixtures. `ml-cpu` installs the CPU `ml` and `serve` extras and runs the SAME suite, then fails
# if any test was skipped, so the model-loading, training, export and serving tests really ran
# (on tiny random synthetic encoders). Neither job is an MPS/CUDA, real-model, real-corpus or
# ranking-quality gate; CI must not download a production encoder or run real training.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run CPU unit tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: Prepare packaging tools (no model downloads)
        run: python -m pip install --disable-pip-version-check build
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify the installed wheel outside the checkout
        run: python scripts/check_wheel.py dist/*.whl

  ml-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU extras (torch CPU wheel, tokenizers, safetensors, FastAPI stack)
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy transformers tokenizers safetensors fastapi uvicorn httpx streamlit
      - name: Run the whole suite and fail on any skip
        run: python scripts/record_receipt.py implementation --output "$RUNNER_TEMP" --python "$(command -v python)"
      - name: Build wheel
        run: python -m pip install --disable-pip-version-check build && python -m build --wheel
      - name: Verify the installed wheel outside the checkout
        run: python scripts/check_wheel.py dist/*.whl
