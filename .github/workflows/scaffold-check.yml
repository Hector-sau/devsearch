name: CPU baseline checks

# Fast, model-free CPU checks: unit tests, wheel build, and an installed-wheel run of
# the baseline commands over tiny fixtures. Not a trained-model, MPS or full-application
# gate; CI must not download a production encoder or run training.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run CPU unit tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: Prepare packaging tools (no model downloads)
        run: python -m pip install --disable-pip-version-check build
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify the installed wheel outside the checkout
        run: python scripts/check_wheel.py dist/*.whl
