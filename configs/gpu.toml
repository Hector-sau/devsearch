# scripts/gpu.py configuration for a rented NVIDIA GPU server (docs/GPU_QUICKSTART.md). Strict: unknown keys fail.
# Only [runtime] usually needs editing. The model, dataset, backend, lock and protocol are FROZEN in <root>/state/frozen.json by the
# first `prepare`; a later change to any of them is refused (use a new runtime root instead).
schema_version = 1

[runtime]
root = "/workspace/devsearch-runtime"   # on the PERSISTENT volume; create it first (never created implicitly)
mount = ""                              # optional: the volume's mount point (e.g. "/workspace"); checked when require_mount_point = true
require_mount_point = false
volume_id = "devsearch-gpu-1"           # written to <root>/.devsearch-volume on the first prepare; must match afterwards
min_free_gib = 60                       # see the storage estimate in the quickstart (about 25 GiB used, 60 leaves room for checkpoints)
time_limit_hours = 24                   # formal campaign deadline = first `run` + this; the campaign stops cleanly (exit 6) at it
step_timeout_minutes = 240              # per command (downloads, receipts and doctor get at least 2 h)

[backend]
profile = "nvidia-cuda"                 # MPS is separate and unverified; "cpu-diagnostic" exists for the CPU fixture tests only
min_cuda = "13.0"                       # torch 2.14.1 in the lock is built for CUDA 13.0: needs NVIDIA driver 580 or newer
min_gpu_memory_gib = 16
device_memory_fraction = 0.9            # device memory cap given to the campaign, as a share of the GPU's memory

[environment]
mode = "lock"                           # a NEW environment from the hashed lock and an offline wheelhouse
python = "python3.12"
lock = "locks/nvidia-cuda-cp312.lock"

[model]
repo = "microsoft/MiniLM-L12-H384-uncased"
revision = "44acabbec0ef496f6dbc93adadea57f376b7c0ec"   # pinned 40-hex commit (verified: pytorch_model.bin 133483028 bytes, sha256 bcc275fe...52fae7)
license = "MIT"
source = "huggingface"
endpoint = "https://huggingface.co"
kind = "pretrained"
token_env = "HF_TOKEN"                  # optional; the public model needs no token

[dataset]
package = "inbox/devsearch-dataset-v2.tar.gz"     # relative to runtime.root; the AUDITED v2 package (private; never in Git)
sha256 = "06e7ae62c3c78cc14d06407005dc91117d869cd73b8e28c45491744e9c488b1f"
# Private draft-release asset of Hector-sau/devsearch (release 406041484, asset 620811833). Either copy the file to `package` (see the
# quickstart: `gh release download ... --pattern 'devsearch-dataset-v2.*'`), or export DEVSEARCH_PACKAGE_TOKEN with a token that can read
# this private repository's releases and let `prepare` fetch it from this URL (verified against sha256 either way).
url = "https://api.github.com/repos/Hector-sau/devsearch/releases/assets/620811833"
token_env = "DEVSEARCH_PACKAGE_TOKEN"

[review]                                # the review protocol is the dataset's own (data.toml [review]; docs/02)
batch_size = 40

[backup]
dir = ""                                # empty: <root>/backup on the same volume; set a second volume and require_independent_device = true if you have one
require_independent_device = false

[receipts]
record = true                           # implementation (whole suite, zero skips) and portable (offline install) receipts; a formal plan needs both
source = "local"                        # explicit alternative: "ci"; see GPU_QUICKSTART section 0.2 (never an automatic fallback)
# import_dir = "/persistent/verified-ci" # output of scripts/ci_receipts.py fetch, transferred without GitHub credentials
# import_sha256 = "..."                 # fetch's SHA-256 of verified-origin.json; freezes with this runtime
