# Example model job for `python -m devsearch.predict` / `python -m devsearch.evaluate` (docs/03 §4).
# The paths are PLACEHOLDERS relative to this file. [assets] and [policy] are needed only to rebuild a model from a
# training checkpoint; an exported inference bundle carries its own pinned assets and length policy.
schema_version = 1

[device]
profile = "cpu-diagnostic"   # apple-mps | nvidia-cuda | cpu-diagnostic

[model]
batch_size = 8               # part of the scoring identity: online and offline scoring must use the same value

[assets]
directory = "../runtime/model-assets"

[policy]
max_pair_tokens = 256
max_query_tokens = 64
