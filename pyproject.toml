[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsearch"
version = "0.0.0"
description = "English technical-documentation search: a model-free BM25 baseline today, a PyTorch reranker planned"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["devsearch*"]
