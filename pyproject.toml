[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devsearch"
version = "1.2.0"
description = "English technical-documentation search with BM25 retrieval and an optional native PyTorch MiniLM reranker"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = []

# The baseline (index/retrieve/validate_manifest, data preparation, metrics) is standard
# library only. Neural training and serving are optional groups. Versions are deliberately
# unpinned here: exact, hashed, platform-specific locks belong to the device profiles
# (configs/profiles/) and are verified per backend, not guessed in this file.
[project.optional-dependencies]
ml = ["torch", "numpy", "transformers", "tokenizers", "safetensors"]
serve = ["fastapi", "uvicorn", "httpx", "streamlit"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["devsearch*"]

[tool.setuptools.package-data]
"devsearch.profiles" = ["*.toml"]
